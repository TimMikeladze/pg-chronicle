services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  rustfs:
    # S3-compatible storage for the archival tests. Pinned to the same release
    # CI runs, for the same reason CI pins it: a mutable :latest means local and
    # CI can disagree about S3 behaviour, and the archival tests are exactly
    # where that would surface.
    image: rustfs/rustfs:1.0.3
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: root
      RUSTFS_SECRET_KEY: password
    ports:
      - "9000:9000"
    volumes:
      - rustfs-data:/data

volumes:
  pgdata:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
  rustfs-data:
    driver: local
