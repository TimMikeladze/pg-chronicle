name: CI

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The test helpers connect to postgres://postgres:postgres@localhost:5432 by
  # default (override with PG_AUDIT_TEST_URL), which is exactly what the service
  # container below exposes — so no database variable is set here. A
  # PG_CONNECTION_STRING used to live here that nothing read, which made it look
  # like CI could be pointed elsewhere.
  PG_HISTORY_S3_ENDPOINT: http://localhost:9000
  PG_HISTORY_S3_ACCESS_KEY_ID: root
  PG_HISTORY_S3_SECRET_ACCESS_KEY: password
  PG_HISTORY_S3_REGION: us-west-1
  PG_HISTORY_S3_BUCKET: test-bucket

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
            # Pin to the same major the project targets (docker-compose uses
            # postgres:16-alpine). An unpinned `postgres` could run a newer major
            # and mask version-specific SQL behavior.
            image: postgres:16-alpine
            env:
              POSTGRES_USER: postgres
              POSTGRES_PASSWORD: postgres
              POSTGRES_DB: postgres
            options: >-
                  --health-cmd pg_isready
                  --health-interval 10s
                  --health-timeout 5s
                  --health-retries 5
            ports:
                  # Maps tcp port 5432 on service container to the host
                  - 5432:5432

    steps:
      - name: Setup Minio
        # Pinned MinIO release (not :latest) so archival/S3 tests run against a
        # fixed server version and builds stay reproducible.
        run: |
          docker run -d -p 9000:9000 --name minio -e "MINIO_ROOT_USER=root" -e "MINIO_ROOT_PASSWORD=password" -v /tmp/data:/data -v /tmp/config:/root/.minio minio/minio:RELEASE.2024-01-16T16-07-38Z server /data
          # Wait for Minio to be ready. FAIL the job if it never comes up — otherwise
          # the S3/archival integration tests would silently skip and a regression
          # in that code path could merge unnoticed.
          timeout 60 bash -c 'until curl -f http://localhost:9000/minio/health/live; do sleep 2; done' || { echo "MinIO failed to start"; docker logs minio || true; exit 1; }

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned (not latest) so CI runs against a fixed Bun version.
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

      - name: Build
        run: bun run build

  node-consumer:
    name: Node ${{ matrix.node }} consumer
    runs-on: ubuntu-latest
    # The library is built with Bun (bunup) but published for Node consumers.
    # This job installs the built package into a plain Node project and exercises
    # every published entrypoint under `node`, so a Bun-only regression in the
    # build output (missing CJS, missing shebang, broken exports map) fails here
    # instead of in a user's app.
    strategy:
      fail-fast: false
      matrix:
        # Oldest maintained LTS through current.
        node: [20, 22, 24]
    services:
      postgres:
            image: postgres:16-alpine
            env:
              POSTGRES_USER: postgres
              POSTGRES_PASSWORD: postgres
              POSTGRES_DB: postgres
            options: >-
                  --health-cmd pg_isready
                  --health-interval 10s
                  --health-timeout 5s
                  --health-retries 5
            ports:
                  - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Install library dependencies
        run: bun install --frozen-lockfile

      # dist/ is gitignored, so the example has nothing to consume until this runs.
      - name: Build library
        run: bun run build

      # npm, not bun: the point is that a Node/npm user can consume the output.
      # `file:../..` symlinks the repo root, so this resolves through the real
      # exports map and the dist/ just built above.
      - name: Install example dependencies
        run: npm install
        working-directory: examples/node

      - name: Run Node consumer smoke test
        run: npm start
        working-directory: examples/node
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    # No postgres or MinIO service: every dashboard page is force-dynamic, so
    # `next build` compiles and typechecks without ever opening a connection.
    # Linting is already covered — the `check` job's `biome check .` sweeps the
    # whole repo, dashboard/ included — and so are the access-control unit tests
    # in dashboard/lib/auth.test.ts, which the root `bun test` picks up (they
    # need no database). What is missing without this job is the dashboard's own
    # tsc (it is excluded from the root tsconfig, having its own) and its build.
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # The dashboard resolves `pg-history` / `pg-history/next` through the
      # symlink created below, which reads the library's own exports map and
      # dist/. So the library's dependencies must be installed before it builds.
      - name: Install library dependencies
        run: bun install --frozen-lockfile

      # dist/ is gitignored, so it must be built before the dashboard typechecks
      # against it. The `pretsc`/`prebuild` hooks do this too, but building here
      # keeps the failure attributable to this step rather than to tsc.
      - name: Build library
        run: bun run build

      - name: Install dashboard dependencies
        run: bun install --frozen-lockfile
        working-directory: dashboard

      # The dashboard declares `pg-history` as a published npm dependency so it
      # can be deployed on its own — the README's one-click Vercel button clones
      # only that directory, and Vercel's Root Directory setting cannot reach a
      # parent. Here we want the opposite: CI must test the library in this
      # commit, not the last release, so the symlink below replaces the npm copy
      # that `bun install` just placed.
      #
      # A symlink, not `file:..`: that makes bun deep-copy the whole parent tree
      # (161M of node_modules included) on every install — slow, and the copy
      # routinely landed without the parent's package.json, leaving
      # `pg-history/next` unresolvable. The link is needed at
      # *runtime*, not just for types: `pg-history` is marked external in
      # next.config.ts, and Next's "collect page data" step actually executes the
      # route modules in Node, so the package must be resolvable on disk.
      - name: Link library into dashboard node_modules
        run: ln -sfn ../.. dashboard/node_modules/pg-history

      - name: Typecheck
        run: bun run tsc
        working-directory: dashboard

      # `prebuild` builds the parent package first, so this also proves the
      # dist/ the dashboard imports is the one the library currently produces.
      - name: Build
        run: bun run build
        working-directory: dashboard

      # The access gate is the only thing between a public URL and an anonymous
      # revert button, and its unit tests (dashboard/lib/auth.test.ts, run by the
      # root suite) cover the decision logic but not the wiring. This boots the
      # production server and checks the wiring itself. No database service is
      # needed: none of these paths reach one.
      - name: Verify the dashboard access gate
        working-directory: dashboard
        env:
          NODE_ENV: production
          PG_HISTORY_TABLES: users
          PG_HISTORY_JWT_SECRET: ci-jwt-secret-value-long-enough
          PG_HISTORY_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: |
          set -euo pipefail

          expect() { # expect <label> <actual> <wanted>
            if [ "$2" != "$3" ]; then
              echo "::error::$1 — expected $3, got $2"
              exit 1
            fi
            echo "ok: $1 ($2)"
          }

          start() { # start <port>; inherits env, plus whatever the caller exported
            bun run start --port "$1" > /tmp/dash-$1.log 2>&1 &
            echo $! > /tmp/dash-$1.pid
            # Ready as soon as it answers at all. /login is reachable in every
            # configuration under test, including the one that 503s the UI, so
            # readiness never depends on the case being asserted.
            for _ in $(seq 1 60); do
              if curl -s -o /dev/null "http://127.0.0.1:$1/login" 2>/dev/null; then
                return 0
              fi
              sleep 1
            done
            echo "::error::server on port $1 never came up"; cat /tmp/dash-$1.log; exit 1
          }
          stop() { kill "$(cat /tmp/dash-$1.pid)" 2>/dev/null || true; sleep 1; }

          # 1. Production with no password must refuse to serve the UI at all.
          start 3300
          expect "no password -> UI refused" \
            "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3300/tables)" 503
          stop 3300

          # 2. With a password: pages redirect to the login, the login itself is
          #    reachable, server actions get a 401 rather than a redirect that
          #    would send their body to /login, and /api keeps its own auth.
          export PG_HISTORY_DASHBOARD_PASSWORD=ci-dashboard-password
          start 3301
          expect "GET page -> redirect" \
            "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3301/tables)" 307
          expect "login reachable" \
            "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3301/login)" 200
          expect "server action without session -> 401" \
            "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3301/tables)" 401
          expect "api without token -> 401" \
            "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3301/api/history/users/1)" 401
          stop 3301