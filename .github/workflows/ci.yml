name: CI

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Database Configuration
  PG_CONNECTION_STRING: postgresql://postgres:postgres@localhost:5432/postgres
  S3_ENDPOINT: http://localhost:9000
  S3_ACCESS_KEY_ID: root
  S3_SECRET_ACCESS_KEY: password
  S3_REGION: us-west-1
  S3_BUCKET: test-bucket

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    services:
      postgres:
            image: postgres
            env:
              POSTGRES_USER: postgres
              POSTGRES_PASSWORD: postgres
              POSTGRES_DB: postgres
            options: >-
                  --health-cmd pg_isready
                  --health-interval 10s
                  --health-timeout 5s
                  --health-retries 5
            ports:
                  # Maps tcp port 5432 on service container to the host
                  - 5432:5432
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    steps:
      - name: Setup Minio
        run: |
          docker run -d -p 9000:9000 --name minio -e "MINIO_ROOT_USER=root" -e "MINIO_ROOT_PASSWORD=password" -v /tmp/data:/data -v /tmp/config:/root/.minio minio/minio server /data
          # Wait for Minio to be ready
          timeout 60 bash -c 'until curl -f http://localhost:9000/minio/health/live; do sleep 2; done' || echo "Minio setup timeout - continuing anyway"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

      - name: Build
        run: bun run build